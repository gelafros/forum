<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Post — Forum</title>
    <link rel="stylesheet" href="/templates/style.css">
</head>
<body>

<header class="site-header">
    <div class="inner">
        <h1><a href="/">💬 Forum — Zone01 Athens</a></h1>
    </div>
</header>

<div class="container">

    <div class="top-nav">
        <a href="/">&larr; Back to Home</a>
    </div>

    <div class="form-card" style="max-width: 620px;">
        <div class="form-header">
            <h1>Create a Post</h1>
            <p class="form-subtitle">Share an idea, ask a question, or start a discussion with the community.</p>
        </div>

        {{if .ErrorMessage}}
            <div class="error-banner">{{.ErrorMessage}}</div>
        {{end}}

        <form action="/create_post" method="POST" enctype="multipart/form-data">

            <div class="form-group">
                <label for="title">Title <span style="color:#ef4444">*</span></label>
                <input type="text" id="title" name="title" value="{{.Title}}" placeholder="What is this post about?" required>
            </div>

            <div class="form-group">
                <label for="content">Content <span style="color:#ef4444">*</span></label>
                <textarea id="content" name="content" placeholder="Share your details, questions, or perspectives..." required>{{.Content}}</textarea>
            </div>

            <div class="form-group">
                <label>Categories <span style="color:#ef4444">*</span> <span class="label-hint">(Select at least one)</span></label>
                <div class="categories-group">
                    {{range .Categories}}
                        <label>
                            <input type="checkbox" name="categories" value="{{.ID}}">
                            {{.Name}}
                        </label>
                    {{end}}
                </div>
            </div>

            <div class="form-group">
                <label for="image">Attach Image <span class="label-hint">(Optional — JPEG, PNG, GIF, SVG up to 20 MB)</span></label>
                <input type="file" id="image" name="image" accept="image/jpeg,image/png,image/gif,image/svg+xml">
            </div>

            <div class="form-actions-row">
                <button type="submit" class="btn">Publish Post</button>
                <a href="/" class="btn btn-outline" style="color: var(--text-main); border-color: var(--border-hover);">Cancel</a>
            </div>
        </form>
    </div>

</div>
</body>
</html>
