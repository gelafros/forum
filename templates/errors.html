<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Code}} {{.Title}}</title>
  <link rel="stylesheet" href="/templates/style.css">
</head>

</body>
</html>
