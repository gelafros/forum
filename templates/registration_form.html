<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="/templates/style.css">
</head>
<body>
    <form method="POST" action="/register">
        <h1>Registration</h1>
        <label for="username">Username*</label><br>
        <input type="text" id="username" name="username" placeholder="Select a username" required><br><br>

        <label for="email">Email*</label><br>
        <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>

        <label for="password">Password*</label><br>
        <input type="password" id="password" name="password" placeholder="Create a password" required><br><br><br><br>

        <label><i>* = Required fields</i></label>

        <br><br>
        <button type="submit">Submit</button>
    </form>
  
</body>
</html>
