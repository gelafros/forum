<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Forum</title>
    <link rel="stylesheet" href="/templates/style.css">
</head>
<body>

<header class="site-header">
    <div class="inner">
        <h1><a href="/">💬 Forum — Zone01 Athens</a></h1>
    </div>
</header>

<div class="container">
    <div class="form-card">
        <div class="form-header">
            <h1>Create Account</h1>
            <p class="form-subtitle">Join the Zone01 forum community to share discussions, post comments, and react.</p>
        </div>

        {{if .ErrorMessage}}
            <div class="error-banner">{{.ErrorMessage}}</div>
        {{end}}

        <form method="POST" action="/register">
            <div class="form-group">
                <label for="username">Username <span style="color:#ef4444">*</span></label>
                <input type="text" id="username" name="username" value="{{.Username}}" placeholder="Choose a unique username" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address <span style="color:#ef4444">*</span></label>
                <input type="email" id="email" name="email" value="{{.Email}}" placeholder="your.name@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password <span style="color:#ef4444">*</span></label>
                <input type="password" id="password" name="password" placeholder="Choose a strong password" required>
            </div>

            <button type="submit" class="btn">Create Account</button>
        </form>

        <div class="form-links">
            Already registered? <a href="/login">Sign in to your account</a>
            <br>
            <a href="/" style="display: inline-block; margin-top: 0.5rem; color: var(--text-muted);">&larr; Back to Home</a>
        </div>
    </div>
</div>

</body>
</html>
