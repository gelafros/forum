<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Forum</title>
    <link rel="stylesheet" href="/templates/style.css">
</head>
<body>

<header class="site-header">
    <div class="inner">
        <h1><a href="/">💬 Forum — Zone01 Athens</a></h1>
    </div>
</header>

<div class="container">
    <div class="form-card">
        <div class="form-header">
            <h1>Sign In</h1>
            <p class="form-subtitle">Welcome back! Enter your credentials to access your forum account.</p>
        </div>

        {{if .ErrorMessage}}
            <div class="error-banner">{{.ErrorMessage}}</div>
        {{end}}

        <form action="/login" method="post">
            <div class="form-group">
                <label for="identifier">Username or Email</label>
                <input type="text" id="identifier" name="identifier" value="{{.Identifier}}" placeholder="e.g. johndoe or user@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn">Sign In</button>
        </form>

        <div class="form-links">
            Don't have an account? <a href="/register">Create an account</a>
            <br>
            <a href="/" style="display: inline-block; margin-top: 0.5rem; color: var(--text-muted);">&larr; Back to Home</a>
        </div>
    </div>
</div>

</body>
</html>
