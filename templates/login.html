<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Forum</title>
    <link rel="stylesheet" href="/templates/style.css">
</head>
<body>

<header class="site-header">
    <div class="inner">
        <h1><a href="/">💬 Forum — Zone01 Athens</a></h1>
    </div>
</header>

<div class="container">
    <div class="form-card">
        <div class="form-header">
            <h1>Sign In</h1>
            <p class="form-subtitle">Welcome back! Enter your credentials to access your forum account.</p>
        </div>

        {{if .ErrorMessage}}
            <div class="error-banner">{{.ErrorMessage}}</div>
        {{end}}

        <form action="/login" method="post">
            <div class="form-group">
                <label for="identifier">Username or Email</label>
                <input type="text" id="identifier" name="identifier" value="{{.Identifier}}" placeholder="e.g. johndoe or user@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn">Sign In</button>
        </form>

        <div class="oauth-divider"><span>or continue with</span></div>
        <div class="oauth-buttons">
            <a href="/auth/google/login" class="btn-oauth">
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.35 11.1h-9.17v2.73h6.51c-.33 1.81-1.5 3.34-3.2 4.37v3.62h5.18c3.03-2.79 4.78-6.9 4.78-11.84 0-.8-.08-1.57-.22-2.31z"/><path fill="currentColor" d="M12.18 22c4.32 0 7.95-1.43 10.6-3.88l-5.18-3.62c-1.43.96-3.26 1.53-5.42 1.53-4.17 0-7.7-2.81-8.96-6.59H-2.1v3.73C.54 18.41 5.95 22 12.18 22z" opacity=".8"/><path fill="currentColor" d="M3.22 13.44a9.63 9.63 0 0 1 0-6.13V3.58H-2.1a16.01 16.01 0 0 0 0 13.59l5.32-3.73z" opacity=".6"/><path fill="currentColor" d="M12.18 4.72c2.35 0 4.46.81 6.12 2.4l4.59-4.59C20.12.98 16.5 0 12.18 0 5.95 0 .54 3.59-2.1 8.83l5.32 3.73c1.26-3.78 4.79-6.59 8.96-6.59z" opacity=".9"/></svg>
                Google
            </a>
            <a href="/auth/github/login" class="btn-oauth">
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .5C5.65.5.5 5.65.5 12c0 5.09 3.29 9.4 7.86 10.92.58.11.79-.25.79-.56v-2c-3.2.7-3.88-1.38-3.88-1.38-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.23-1.28-5.23-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.12 3.05.74.81 1.18 1.83 1.18 3.09 0 4.41-2.69 5.38-5.25 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.68.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
                GitHub
            </a>
        </div>

        <div class="form-links">
            Don't have an account? <a href="/register">Create an account</a>
            <br>
            <a href="/" style="display: inline-block; margin-top: 0.5rem; color: var(--text-muted);">&larr; Back to Home</a>
        </div>
    </div>
</div>

</body>
</html>
